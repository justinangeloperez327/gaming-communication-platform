[package]
name = "gaming-comms-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "HTTP API foundation for Gaming Communication Platform"
publish = false

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
