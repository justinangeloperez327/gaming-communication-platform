name: Generate Cargo lockfile
on:
  push:
    paths:
      - ".github/workflows/generate-lockfile.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    # Never automatically mutate main when this workflow is merged.
    if: github.event_name == 'workflow_dispatch' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # Resolve only missing/new requirements while retaining existing lock pins.
      - run: cargo fmt --all
      - run: cargo check --workspace
      - name: Commit Cargo lockfile
        run: |
          git add -f Cargo.lock
          git add apps/server/src apps/server/tests
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format Rust and lock dependencies"
            git push
          fi
