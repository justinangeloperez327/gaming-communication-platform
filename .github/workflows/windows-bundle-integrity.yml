name: Windows bundle integrity checks
on:
  pull_request:
    paths:
      - 'scripts/*windows-test*.ps1'
      - 'scripts/*windows*.ps1'
      - 'scripts/windows-distribution.psm1'
      - 'packaging/windows/**'
      - 'scripts/verify-windows-notices.ps1'
      - 'third_party/notices/**'
      - '.gitattributes'
      - '.github/workflows/windows-bundle-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - name: Verify synthetic integrity fixtures
        shell: pwsh
        run: |
          $allErrors = @()
          foreach ($file in Get-ChildItem scripts -File | Where-Object { $_.Extension -in @('.ps1','.psm1') }) {
            $tokens = $null; $parseErrors = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $allErrors += @($parseErrors)
          }
          if ($allErrors.Count) { $allErrors | Format-List; throw 'PowerShell parsing failed' }
          ./scripts/test-windows-test-bundle.ps1
          ./scripts/test-windows-distribution.ps1
      - name: Actual installer fingerprint and upgrade policy (synthetic payload)
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/test-windows-installer-policy.ps1
