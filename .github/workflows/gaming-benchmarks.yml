name: Gaming performance tooling tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/gaming-benchmarks.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Offline benchmark analyzer tests (not hardware qualification)
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Compile-check Python tools
        run: python -m compileall -q scripts

      - name: Windows PowerShell 5.1 collector policy and process-only smoke
        shell: powershell
        run: ./scripts/test-desktop-performance.ps1
      - name: PowerShell 7 collector policy and process-only smoke
        shell: pwsh
        run: ./scripts/test-desktop-performance.ps1
