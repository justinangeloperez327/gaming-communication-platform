name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust API checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace

  desktop:
    name: Windows Qt and native media build
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build/desktop --config Release --parallel
      - name: Smoke tests
        shell: pwsh
        run: ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Upload native diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-media-probe-win64
          path: build/desktop/native/probe/Release/gcp-media-probe.exe
          if-no-files-found: error
          retention-days: 7
