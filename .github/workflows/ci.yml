name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust API checks
    runs-on: ubuntu-latest
    env:
      GCP_TEST_DATABASE_URL: postgres://gcp_test:gcp_test@127.0.0.1:5432/gcp_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gcp_test
          POSTGRES_USER: gcp_test
          POSTGRES_PASSWORD: gcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcp_test -d gcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Sanitized portable H.264 parser and timing tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g -I native/transport/src native/transport/tests/portable_tests.cpp native/transport/src/h264_access_unit.cpp native/transport/src/annexb_h264.cpp -o /tmp/gcp-parser-tests
          /tmp/gcp-parser-tests
          g++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined -g -I native/transport/src native/transport/tests/voice_control_tests.cpp -o /tmp/gcp-voice-control-tests
          /tmp/gcp-voice-control-tests
      - name: Offline physical GPU evidence validator tests
        run: python3 -m unittest discover -s scripts -p 'test_validate_hardware_stream.py'
      - name: Frame-time comparison tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  desktop:
    name: Windows Qt, media and LiveKit builds
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure with pinned LiveKit SDK
        shell: pwsh
        run: cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DGCP_ENABLE_LIVEKIT=ON -DGCP_LIVEKIT_DOWNLOAD=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/desktop --config Release --parallel
      - name: Smoke tests
        shell: pwsh
        run: ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Exercise package integrity rejection fixtures
        shell: pwsh
        run: ./scripts/test-windows-test-bundle.ps1
      - name: Stage unsigned Windows desktop test bundle
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\\bin;$env:PATH"
          ./scripts/package-windows-test.ps1 -BuildDirectory build/desktop/Release -OutputDirectory build/gcp-windows-test
          ./scripts/verify-windows-test-bundle.ps1 -BundleDirectory build/gcp-windows-test
      - name: Test packaged Qt/QML runtime and native LiveKit startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          # gcp-desktop.exe is a WIN32 GUI-subsystem binary. PowerShell's
          # direct invocation does not reliably wait or set LASTEXITCODE.
          $desktop = (Resolve-Path ./build/gcp-windows-test/gcp-desktop.exe).Path
          $child = Start-Process -FilePath $desktop -ArgumentList '--smoke-qml' -WorkingDirectory (Split-Path $desktop) -PassThru
          try {
            $child | Wait-Process -Timeout 20 -ErrorAction Stop
            $child.Refresh()
            if ($null -eq $child.ExitCode -or $child.ExitCode -ne 0) {
              throw "Packaged Qt/QML smoke test failed: $($child.ExitCode)"
            }
          } finally {
            if (-not $child.HasExited) {
              Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue
            }
            $child.Dispose()
          }
          & ./build/gcp-windows-test/gcp-livekit-voice.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "Packaged LiveKit voice self-test failed: $LASTEXITCODE" }
      - name: Record CI-only Windows bundle acceptance
        shell: pwsh
        run: |
          ./scripts/write-windows-ci-acceptance.ps1 -BundleDirectory build/gcp-windows-test -OutputFile build/windows-ci-acceptance.json -CommitSha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Validate CI-only acceptance record
        shell: pwsh
        run: |
          ./scripts/verify-windows-ci-acceptance.ps1 -RecordFile build/windows-ci-acceptance.json -ExpectedCommit "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload Windows package acceptance record
        uses: actions/upload-artifact@v4
        with:
          name: gcp-windows-ci-acceptance
          path: build/windows-ci-acceptance.json
          if-no-files-found: error
          retention-days: 7
      - name: Inventory Windows executable signing state
        shell: pwsh
        run: |
          ./scripts/inventory-windows-signatures.ps1 -BundleDirectory build/gcp-windows-test -OutputFile build/windows-signature-inventory.json
      - name: Verify executable inventory consistency
        shell: pwsh
        run: |
          ./scripts/verify-windows-signature-inventory.ps1 -BundleDirectory build/gcp-windows-test -InventoryFile build/windows-signature-inventory.json
      - name: Upload signing inventory
        uses: actions/upload-artifact@v4
        with:
          name: gcp-windows-signature-inventory
          path: build/windows-signature-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Create and verify private portable ZIP
        shell: pwsh
        run: |
          ./scripts/package-private-windows-zip.ps1 -BundleDirectory build/gcp-windows-test -OutputZip build/gcp-private-windows-x64.zip
          $unpacked = Join-Path $env:RUNNER_TEMP 'gcp-zip-verification'
          Expand-Archive -LiteralPath build/gcp-private-windows-x64.zip -DestinationPath $unpacked
          ./scripts/verify-windows-test-bundle.ps1 -BundleDirectory $unpacked
          # Test the extracted ZIP, not only the original staging directory.
          $env:QT_QPA_PLATFORM = "offscreen"
          $desktop = (Resolve-Path (Join-Path $unpacked 'gcp-desktop.exe')).Path
          $child = Start-Process -FilePath $desktop -ArgumentList '--smoke-qml' -WorkingDirectory $unpacked -PassThru
          try {
            $child | Wait-Process -Timeout 20 -ErrorAction Stop
            $child.Refresh()
            if ($null -eq $child.ExitCode -or $child.ExitCode -ne 0) {
              throw "Extracted ZIP Qt/QML startup failed: $($child.ExitCode)"
            }
          } finally {
            if (-not $child.HasExited) { Stop-Process -Id $child.Id -Force -ErrorAction SilentlyContinue }
            $child.Dispose()
          }
          & (Join-Path $unpacked 'gcp-livekit-voice.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw "Extracted ZIP LiveKit self-test failed: $LASTEXITCODE" }
          $zipSha = (Get-FileHash -LiteralPath build/gcp-private-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipSha | Set-Content -LiteralPath build/gcp-private-windows-x64.sha256 -Encoding ascii
          $savedSha = (Get-Content -LiteralPath build/gcp-private-windows-x64.sha256 -Raw).Trim()
          if ($savedSha -cne $zipSha) { throw "Portable ZIP checksum file does not match archive" }
      - name: Upload private portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: gcp-private-windows-x64
          path: |
            build/gcp-private-windows-x64.zip
            build/gcp-private-windows-x64.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified unsigned desktop test bundle
        uses: actions/upload-artifact@v4
        with:
          name: gcp-desktop-unsigned-test-win64
          path: build/gcp-windows-test/
          if-no-files-found: error
          retention-days: 7
      - name: Upload native voice diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-livekit-voice-win64
          path: |
            build/desktop/Release/gcp-livekit-voice.exe
            build/desktop/Release/livekit.dll
            build/desktop/Release/livekit_ffi.dll
          if-no-files-found: error
          retention-days: 7
      - name: Upload GPU hardware H.264 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-hardware-h264-win64
          path: build/desktop/Release/gcp-hardware-h264.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload media diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-media-probe-win64
          path: build/desktop/Release/gcp-media-probe.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload hardware LiveKit bridge
        uses: actions/upload-artifact@v4
        with:
          name: gcp-livekit-hardware-win64
          path: |
            build/desktop/Release/gcp-livekit-hardware.exe
            build/desktop/Release/livekit.dll
            build/desktop/Release/livekit_ffi.dll
          if-no-files-found: error
          retention-days: 7
      - name: Upload LiveKit diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-livekit-smoke-win64
          path: |
            build/desktop/Release/gcp-livekit-smoke.exe
            build/desktop/Release/livekit.dll
            build/desktop/Release/livekit_ffi.dll
          if-no-files-found: error
          retention-days: 7
