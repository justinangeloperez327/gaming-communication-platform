name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Rust API checks
    runs-on: ubuntu-latest
    env:
      GCP_TEST_DATABASE_URL: postgres://gcp_test:gcp_test@127.0.0.1:5432/gcp_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gcp_test
          POSTGRES_USER: gcp_test
          POSTGRES_PASSWORD: gcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gcp_test -d gcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Temporary auth lockfile synchronization
        run: |
          cargo generate-lockfile
          python3 - <<'PY'
          from pathlib import Path
          import base64
          payload = base64.b64encode(Path('Cargo.lock').read_bytes()).decode('ascii')
          print('GCP_AUTH_CARGO_LOCK_BEGIN')
          for i in range(0, len(payload), 4096):
              print('GCP_AUTH_CARGO_LOCK:' + payload[i:i+4096])
          print('GCP_AUTH_CARGO_LOCK_END')
          PY
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Offline physical GPU evidence validator tests
        run: python3 -m unittest discover -s scripts -p 'test_validate_hardware_stream.py'
      - name: Frame-time comparison tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  desktop:
    name: Windows Qt, media and LiveKit builds
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Configure with pinned LiveKit SDK
        shell: pwsh
        run: cmake -S . -B build/desktop -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR" -DGCP_ENABLE_LIVEKIT=ON -DGCP_LIVEKIT_DOWNLOAD=ON
      - name: Build
        shell: pwsh
        run: cmake --build build/desktop --config Release --parallel
      - name: Smoke tests
        shell: pwsh
        run: ctest --test-dir build/desktop -C Release --output-on-failure
      - name: Upload GPU hardware H.264 diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-hardware-h264-win64
          path: build/desktop/Release/gcp-hardware-h264.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload media diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-media-probe-win64
          path: build/desktop/Release/gcp-media-probe.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload hardware LiveKit bridge
        uses: actions/upload-artifact@v4
        with:
          name: gcp-livekit-hardware-win64
          path: |
            build/desktop/Release/gcp-livekit-hardware.exe
            build/desktop/Release/livekit.dll
            build/desktop/Release/livekit_ffi.dll
          if-no-files-found: error
          retention-days: 7
      - name: Upload LiveKit diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: gcp-livekit-smoke-win64
          path: |
            build/desktop/Release/gcp-livekit-smoke.exe
            build/desktop/Release/livekit.dll
            build/desktop/Release/livekit_ffi.dll
          if-no-files-found: error
          retention-days: 7
